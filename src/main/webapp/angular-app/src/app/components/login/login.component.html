<form #f="ngForm" (ngSubmit)="f.form.valid && login()" name="form" novalidate>

  <div class="row mt-3">
    <div class="col-3">
      <label>Email</label>
      <input [(ngModel)]="model.email" [pattern]="patternEmail" class="form-control form-control-sm" name="email"
             required type="text"/>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-3">
      <label>Password</label>
      <input [(ngModel)]="model.password" class="form-control form-control-sm" name="password" required
             type="password"/>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-3">
      <button [disabled]="f.form.invalid" class="btn btn-primary pull-right" type="submit">Log In</button>
    </div>
  </div>

</form>

<div class="row mt-3">
  <div class="col-2">
    <button (click)="goToResetPassword()" class="btn btn-primary">Password dimenticata?</button>
  </div>
  <div class="col-1">
    <button (click)="goToRegister()" class="btn btn-primary pull-right">Registrati</button>
  </div>
</div>

<div class="row mt-3">
  <div class="col-3">
    <div [hidden]="!errMsg" class="alert alert-danger">
      <strong>{{errMsg}}</strong>
    </div>
  </div>
</div>
