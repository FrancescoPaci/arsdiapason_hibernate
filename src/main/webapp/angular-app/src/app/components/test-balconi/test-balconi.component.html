<div [hidden]="idBambino" class="row">
  <div class="col-8">
    <div class="alert alert-info">
      <strong>Per fare il test è necessario cliccare sul pulsante 'Fai il Test' sulla riga di un bambino dalla pagina
        <a [routerLink]="['/childList']" routerLinkActive="active">Lista Bambini</a>
      </strong>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-7">
    <app-specchietto-bambino [bambino]="bambino"></app-specchietto-bambino>
  </div>
</div>

<div *ngIf="bambino && !bambino.testFinito" class="row mb-2">
  <div class="col-4 form-inline">
    <label class="mr-2">Data Test</label>
    <input [(ngModel)]="bambino.dataTest" class="form-control form-control-sm" max="{{today | date:'yyyy-MM-dd'}}"
           name="dataTest"
           required type="date">
  </div>
</div>

<div class="row">
  <div class="col-2">
    <table>
      <tr *ngFor="let scheda of schede">
        <td>
          <button (click)="showDatiScheda(scheda)"
                  [ngClass]="{'btn-success': scheda.complete || (bambino && bambino.testFinito)}"
                  class="btn btn-primary w-100">
            Scheda {{scheda.numero}}
          </button>
        </td>
        <td>
          <button (click)="downloadImg(scheda)" *ngIf="scheda.immagini" class="btn btn-primary ml-2"
                  tooltip="Scarica immagine">
            <i class="fa fa-download"></i>
          </button>
        </td>
        <td [hidden]="true || !bambino">
          <button class="btn btn-primary ml-2" tooltip="Carica test competato">
            <i class="fa fa-upload"></i>
          </button>
        </td>
      </tr>
      <tr [hidden]="!bambino || bambino.testFinito">
        <td colspan="3">
          <button (click)="saveTest()" [disabled]="!allSchedeComplete()" class="btn btn-primary w-100 mt-1"
                  type="submit">Salva il Test
          </button>
        </td>
      </tr>
    </table>
  </div>

  <div *ngIf="currentScheda.titolo" class="col-4 text-center">
    <div class="row">
      <div class="col-12">
        <h4>{{currentScheda.numero}} - {{currentScheda.titolo}}</h4>
        <h6>{{currentScheda.obbiettivo}}</h6>
      </div>
    </div>
    <div [hidden]="!currentScheda.immagini" class="row">
      <div *ngFor="let img of getArrayImages(currentScheda.immagini)"
           class="{{getArrayImages(currentScheda.immagini).length > 1 ? 'col-6': 'col-12'}}">
        <img class="mb-1" src="/assets/img/scheda{{currentScheda.numero}}{{img}}.png">
      </div>
    </div>
  </div>

  <div class="col-6">
    <div *ngFor="let scheda of schede" [hidden]="scheda.numero !== currentScheda.numero" class="col-12">
      <table *ngFor="let obj of tipiScheda[scheda.numero]" class="table table-bordered table-striped points-table">
        <tbody>
        <tr *ngIf="obj.tipo">
          <th [attr.colspan]="arrayAnni.length + 2" class="text-center">{{obj.tipo.toUpperCase()}}</th>
        </tr>
        <tr>
          <th>ANNI</th>
          <th></th>
          <th *ngFor="let anni of arrayAnni">{{anni}}</th>
        </tr>
        <tr>
          <th>ESITO</th>
          <th>
            <div [hidden]="!bambino">
              <input (change)="uncheckAll(obj, scheda)" [(ngModel)]="obj.noResult"
                     [disabled]="bambino && bambino.testFinito" id="scheda{{scheda.numero}}{{obj.tipo}}"
                     name="scheda{{scheda.numero}}{{obj.tipo}}"
                     type="checkbox">
            </div>
            <label for="scheda{{scheda.numero}}{{obj.tipo}}">Requisiti minimi non soddisfatti</label>
          </th>
          <th *ngFor="let anni of arrayAnni">
            <div *ngFor="let row of obj.rows" [hidden]="row.anni !== anni">
              <div *ngIf="bambino">
                <input (change)="checkBefore(obj, row.id, scheda)" [(ngModel)]="row.checked"
                       [disabled]="bambino && bambino.testFinito" id="prova{{scheda.numero}}{{obj.tipo}}{{row.anni}}"
                       name="prova{{scheda.numero}}{{obj.tipo}}{{row.anni}}"
                       type="checkbox">
              </div>
              <label [innerHTML]="getTableText(obj.rows, row, idBambino)"
                     for="prova{{scheda.numero}}{{obj.tipo}}{{row.anni}}"></label>
            </div>
          </th>
        </tr>
        <tr>
          <th>PROVA</th>
          <th></th>
          <th *ngFor="let anni of arrayAnni">
              <span *ngFor="let row of getRowsByAnni(obj.rows, anni); let i = index">
                <span *ngIf="i === 0">{{row.prova}}</span>
                <span *ngIf="i > 0"> e/o {{row.prova}}</span>
              </span>
          </th>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
