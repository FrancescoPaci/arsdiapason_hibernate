<form #f="ngForm" (ngSubmit)="f.form.valid && confirmAccount()" name="form" novalidate>

  <div class="row mt-3">
    <div class="col-3">
      <label>Password</label>
      <input [(ngModel)]="password" class="form-control form-control-sm" name="password" required type="password"/>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-3">
      <button [disabled]="f.form.invalid" class="btn btn-primary" type="submit">Conferma</button>
    </div>
  </div>

</form>
