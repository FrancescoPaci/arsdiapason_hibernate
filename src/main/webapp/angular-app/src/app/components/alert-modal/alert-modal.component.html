<div class="modal-header {{textColor}}">
  <h4 class="modal-title pull-left font-weight-bold">{{title}}</h4>
  <button (click)="bsModalRef.hide()" aria-label="Close" class="close pull-right" type="button">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body {{textColor}}" style="word-wrap: break-word;">
  <strong [innerHTML]="text"></strong>
</div>
<div class="modal-footer">
  <button (click)="bsModalRef.hide()" class="btn btn-default" type="button">Chiudi</button>
</div>
