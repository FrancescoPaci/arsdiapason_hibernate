<div [hidden]="successMsg">

  <div class="row">
    <div class="col-6">
      <div class="alert alert-success">
        Immetti l'email con la quale ti sei registrato e clicca <strong>Invia mail</strong>
        <br>Ti verrà inviato un link per reimpostare la password
      </div>
    </div>
  </div>

  <form #f="ngForm" (ngSubmit)="f.form.valid && sendResetPasswordEmail()" name="form" novalidate>

    <div class="row">
      <div class="col-4">
        <label>Email</label>
        <input [(ngModel)]="model.email" [pattern]="patternEmail" class="form-control form-control-sm" name="email"
               required type="email"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <button [disabled]="f.form.invalid" class="btn btn-primary pull-right" type="submit">Invia mail</button>
      </div>
    </div>

  </form>

  <div class="row mt-3">
    <div class="col-4">
      <button (click)="goToLogin()" class="btn btn-primary pull-right">Torna alla Login</button>
    </div>
  </div>

</div>

<div [hidden]="!successMsg" class="row">
  <div class="col-4">
    <div class="alert alert-success">
      <strong>{{successMsg}}</strong>
    </div>
  </div>
</div>
