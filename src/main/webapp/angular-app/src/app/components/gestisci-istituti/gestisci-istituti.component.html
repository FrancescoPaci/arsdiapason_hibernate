<div class="row">

  <div class="col-5">
    <form #f="ngForm" (ngSubmit)="f.form.valid && inserisciIstituto()" name="form" novalidate>
      <fieldset>
        <legend class="second-title">Inserisci Nuovo Istituto</legend>

        <div class="row mb-3">
          <div class="col-6">
            <label>Nome</label>
            <input [(ngModel)]="newIstituto.nome" class="form-control form-control-sm" name="nome" required
                   type="text"/>
          </div>
          <div class="col-6">
            <label>Regione</label>
            <select (change)="onRegionChange($event.target.value)"
                    [(ngModel)]="newIstituto.regione"
                    class="form-control form-control-sm"
                    name="regione"
                    required>
              <option *ngFor="let reg of regioni" [value]="reg">{{ reg }}</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label>Provincia</label>
            <select [(ngModel)]="newIstituto.provincia"
                    [disabled]="!newIstituto.regione"
                    class="form-control form-control-sm"
                    name="provincia"
                    required>
              <option *ngFor="let prov of province" [value]="prov">{{ prov }}</option>
            </select>
          </div>
          <div class="col-6">
            <label>Comune</label>
            <input [(ngModel)]="newIstituto.comune"
                   [disabled]="!newIstituto.provincia"
                   class="form-control form-control-sm"
                   name="comune"
                   required
                   type="text"/>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label>Indirizzo</label>
            <input [(ngModel)]="newIstituto.indirizzo" class="form-control form-control-sm" name="indirizzo" required
                   type="text"/>
          </div>
          <div class="col-3">
            <label>Tipo</label>
            <div>Scuola media</div>
          </div>
          <div class="col-3">
            <label>Classi</label>
            <div>5</div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <label>Sezioni</label>
            <input [(ngModel)]="newIstituto.sezioni" class="form-control form-control-sm" name="sezioni"
                   placeholder="Inserire le sezioni separate dalla virgola"
                   required type="text"/>
          </div>
        </div>

        <div class="row align-items-end">
          <div class="col-12" style="text-align: right">
            <button [disabled]="f.form.invalid" class="btn btn-primary mr-3" type="submit">Salva</button>
            <button (click)="svuotaCampi()" class="btn btn-primary">Svuota Campi</button>
          </div>
        </div>
      </fieldset>
    </form>
  </div>

  <div *ngIf="istituti.length" class="col-7">
    <form [formGroup]="istitutiForm">
      <div class="text-center second-title mb-1">Lista Istituti Inseriti</div>
      <table class="table table-sm table-striped">
        <thead>
        <tr>
          <th>Nome</th>
          <th>Regione</th>
          <th>Provincia</th>
          <th>Comune</th>
          <th>Indirizzo</th>
          <th>Sezioni</th>
          <th></th>
        </tr>
        </thead>
        <tbody formArrayName="istitutiRows">
        <tr *ngFor="let istituto of istituti; let i = index">
          <ng-container *ngIf="!istituto.inModifica">
            <td>{{istituto.nome}}</td>
            <td>{{istituto.regione}}</td>
            <td>{{istituto.provincia}}</td>
            <td>{{istituto.comune}}</td>
            <td>{{istituto.indirizzo}}</td>
            <td>
              <select class="custom-select custom-select-sm">
                <option *ngFor="let x of istituto.sezioni.split(',')">
                  {{ x.trim() }}
                </option>
              </select>
            </td>

            <td class="buttons">
              <button (click)="istituto.inModifica = true" class="btn btn-primary btn-sm" tooltip="Modifica">
                <i class="fa fa-pencil"></i>
              </button>
              <button (click)="eliminaIstituto(i)" class="btn btn-primary btn-sm ml-1" tooltip="Elimina">
                <i class="fa fa-trash-o"></i>
              </button>
            </td>
          </ng-container>
          <ng-container *ngIf="istituto.inModifica" [formGroupName]="i">
            <td><input class="form-control form-control-sm" formControlName="nome" type="text"></td>
            <td><input class="form-control form-control-sm" formControlName="regione" type="text"></td>
            <td><input class="form-control form-control-sm" formControlName="provincia" type="text"></td>
            <td><input class="form-control form-control-sm" formControlName="comune" type="text"></td>
            <td><input class="form-control form-control-sm" formControlName="indirizzo" type="text"></td>
            <td><input class="form-control form-control-sm" formControlName="sezioni" type="text"></td>
            <td class="buttons">
              <button (click)="saveModIstituto(i)" [disabled]="formInvalid(i)" class="btn btn-primary btn-sm"
                      tooltip="Salva" type="submit">
                <i class="fa fa-save"></i>
              </button>
              <button (click)="cancelModIstituto(i)" class="btn btn-primary btn-sm ml-1" tooltip="Annulla">
                <i class="fa fa-times"></i>
              </button>
            </td>
          </ng-container>
        </tr>
        </tbody>
      </table>
    </form>
  </div>

</div>
