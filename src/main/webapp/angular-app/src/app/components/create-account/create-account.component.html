<div [hidden]="showSuccessMsg">

  <form #f="ngForm" (ngSubmit)="f.form.valid && checkPassword() && register()" name="form" novalidate>

    <div class="row mt-3">
      <div class="col-4">
        <label>Nome</label>
        <input [(ngModel)]="model.nome" class="form-control form-control-sm" name="nome" required type="text"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <label>Cognome</label>
        <input [(ngModel)]="model.cognome" class="form-control form-control-sm" name="cognome" required type="text"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <label>Email</label>
        <input [(ngModel)]="model.email" [pattern]="patternEmail" class="form-control form-control-sm" name="email"
               required type="text"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <label>Password</label>
        <input
          [(ngModel)]="model.password"
          [pattern]="patternPassword" class="form-control form-control-sm" name="password" required
          tooltip="Minimo 8 caratteri, massimo 20, nessuno spazio, almeno una maiuscola, una minuscola, un numero e un carattere speciale tra questi @$!=%*?^&+#"
          type="password"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <label>Conferma Password</label>
        <input [(ngModel)]="model.password2" [pattern]="patternPassword" class="form-control form-control-sm"
               name="password2"
               required tooltip="Deve essere uguale alla password" type="password"/>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-4">
        <button [disabled]="f.form.invalid" class="btn btn-primary pull-right" type="submit">Crea Account</button>
      </div>
    </div>

  </form>

  <div class="row mt-3">
    <div class="col-4">
      <button (click)="goToLogin()" class="btn btn-primary pull-right">Torna alla Login</button>
    </div>
  </div>

</div>

<div [hidden]="!errMsg" class="row mt-3">
  <div class="col-4">
    <div class="alert alert-danger">
      <strong>{{errMsg}}</strong>
    </div>
  </div>
</div>

<div [hidden]="!showSuccessMsg" class="row mt-3">
  <div class="col-4">
    <div class="alert alert-success">
      <strong>Registrazione avvenuta con successo.<br>
        Controllare la mail per completare la registrazione.</strong>
    </div>
  </div>
</div>
