<div class="row">
  <div class="col-6">
    <div class="alert alert-success">
      Immetti la nuova password e clicca <strong>Reimposta</strong>
    </div>
  </div>
</div>

<form #f="ngForm" (ngSubmit)="f.form.valid && checkPassword() && resetPassword()" name="form" novalidate>

  <div class="row">
    <div class="col-4">
      <label>Password</label>
      <input [(ngModel)]="password" [pattern]="patternPassword" class="form-control form-control-sm" name="password"
             required
             tooltip="Minimo 8 caratteri, massimo 20, nessuno spazio, almeno una maiuscola, una minuscola, un numero e un carattere speciale tra questi @$!=%*?^&+#"
             type="password"/>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-4">
      <label>Conferma Password</label>
      <input [(ngModel)]="password2" [pattern]="patternPassword" class="form-control form-control-sm" name="password2"
             required tooltip="Deve essere uguale alla password" type="password"/>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-4">
      <button [disabled]="f.form.invalid" class="btn btn-primary pull-right" type="submit">Reimposta</button>
    </div>
  </div>

</form>

<div class="row mt-3">
  <div class="col-4">
    <button (click)="goToLogin()" class="btn btn-primary pull-right">Torna alla Login</button>
  </div>
</div>

<div [hidden]="!errMsg" class="row mt-3">
  <div class="col-4">
    <div class="alert alert-danger">
      <strong>{{errMsg}}</strong>
    </div>
  </div>
</div>
