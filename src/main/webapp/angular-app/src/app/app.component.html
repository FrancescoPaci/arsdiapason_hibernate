<div class="container-fluid">

  <nav class="row navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand">
      <div>
        <span class="title">Arsdiapason</span> - <span class="title2">Test Balconi</span>
      </div>
      <div [hidden]="!loggedIn()" class="subtitle">Bentornato {{user.nome}}</div>
    </a>
    <button *ngIf="loggedIn()" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation"
            class="navbar-toggler" data-target="#navbarNavAltMarkup" data-toggle="collapse"
            type="button">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div *ngIf="loggedIn()" class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav mr-auto">
        <li *ngFor="let p of pages" [hidden]="p.hidden" class="nav-item">
          <a class="nav-link {{p.class}}" routerLink="{{p.route}}" routerLinkActive="active">{{p.title}}</a>
        </li>
      </div>
      <span (click)="logout()" [hidden]="!loggedIn()" class="navbar-text c-pointer pr-5">Logout</span>
    </div>
  </nav>

  <div class="row py-3">
    <div class="col-12 px-5">
      <h3 class="mb-3">{{page}}</h3>
      <router-outlet></router-outlet>
    </div>
  </div>

</div>

<ngx-spinner [fullScreen]="true" size="medium" type="line-spin-fade">
  <p style="color: white"> Loading... </p>
</ngx-spinner>
