# H2 Database Configuration (In-Memory con compatibilità MySQL)
spring.datasource.url=jdbc:h2:file:./data/sito_psiche;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.generatedKeySql=JDBC
spring.datasource.isIdentity=true
spring.datasource.schema=

# Abilita la H2 Console via browser (accessibile su http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Se usi uno script SQL iniziale (es. schema.sql / data.sql) per popolare H2 all'avvio:
# spring.datasource.initialization-mode=always

